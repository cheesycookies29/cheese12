<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Help & guides · ATLAS</title>
  <link rel="icon" type="image/svg+xml" href="/img/brand/atlas-app-icon.svg" />
  <link rel="icon" type="image/png" sizes="48x48" href="/img/favicon.png" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/help.css" />
  <script>
    try { var t = localStorage.getItem('lms-theme'); if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.dataset.theme = 'dark'; } catch (e) {}
  </script>
</head>
<body class="booting help-app" data-app="ATLAS Help">
  <div class="app">
    <header class="topbar">
      <button type="button" class="icon-btn help-menu-btn" id="menu-btn" aria-label="Guides" aria-controls="help-side" aria-expanded="false"></button>
      <a class="brand" href="/help/#/"><img id="brand-logo" src="/img/brand/atlas-mark.svg" alt="" /><span><strong id="school-name"></strong><small id="brand-sub"></small></span></a>
      <form class="help-search top-search" id="top-search" role="search"><span class="search-ic" aria-hidden="true"></span><input type="search" name="q" placeholder="Search the guides" aria-label="Search the guides" autocomplete="off" /><kbd aria-hidden="true">/</kbd></form>
      <span class="topbar-spacer"></span>
      <a class="round-btn" href="/" title="All systems" aria-label="All systems" id="home-btn"></a>
      <button type="button" class="round-btn" id="theme-btn" aria-label="Dark mode"></button>
    </header>
    <div class="help-scrim" id="help-scrim" hidden></div>
    <main id="app" class="help-main"></main>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/js/help/app.js"></script>
</body>
</html>
