<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>University Portal</title>
  <link rel="icon" type="image/png" href="/img/favicon.png" />
  <link rel="apple-touch-icon" href="/img/icon-192.png" />
  <link rel="stylesheet" href="/css/styles.css" />
  <script>
    try { var t = localStorage.getItem('lms-theme'); if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.dataset.theme = 'dark'; } catch (e) {}
  </script>
</head>
<body class="booting hub">
  <div id="auth"></div>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="/"><img id="brand-logo" src="/img/logo.png" alt="" /><span><strong id="school-name"></strong><small id="brand-sub">University Portal</small></span></a>
      <span class="topbar-spacer"></span>
      <button type="button" class="round-btn" id="theme-btn" aria-label="Dark mode"></button>
      <div class="user-menu" id="user-box"></div>
    </header>
    <main id="app" class="hub-main"></main>
  </div>
  <div id="toast"></div>
  <script type="module" src="/js/hub/app.js"></script>
</body>
</html>
