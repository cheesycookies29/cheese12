      <tr><td style="padding:0"><img src="email/p01.jpg" width="640" alt="Now in ATLAS, November 2026. One school. One sign-in. Classes, people, records and now the school's books, on one platform, with a calendar for everyone. Learn, Academic, People, and new: Finance and Calendar." style="display:block;width:100%;max-width:640px;height:auto;border:0" /></td></tr>
      <tr><td style="padding:0"><img src="email/p02.jpg" width="640" alt="Four systems, one sign-in. Learn (LMS): enrollment, lessons, quizzes, attendance, grades and a school calendar. People (HRIS): time clock, leave, government payroll and payslips, powered by CORE HR and Payroll. Academic (UIS): student records, grade sheets, transcripts with a QR check, CHED and FHE reports. New, Finance (FMIS): budget and obligations, procurement and property, vouchers and receipts, journals and financial statements, following COA, DBM and BIR rules. Across all four: school calendar, Settings center, roles and permissions, Help and guides, Keycloak single sign-on, many campuses." style="display:block;width:100%;max-width:640px;height:auto;border:0" /></td></tr>
      <tr><td style="padding:0"><img src="email/p03.jpg" width="640" alt="CORE runs the company. ATLAS runs the school. ATLAS People runs on the payroll engine of CORE's HR and Payroll module, and in ATLAS it also runs government payroll and posts it to Finance. One design language, and both are built the same way by the same Lancaster team. They share code, design and the team, not data: each runs on its own server with its own records." style="display:block;width:100%;max-width:640px;height:auto;border:0" /></td></tr>
      <tr><td style="padding:0"><img src="email/p04.jpg" width="640" alt="From clock-in to the voucher. Government payroll by the rules for a state university goes from People to Finance in one step, all or nothing: clock in, attendance, payroll run, obligation request, voucher, paid and remitted. Demo school: gross pay 544,211.74 pesos, deductions 101,830.30, net pay 442,381.44." style="display:block;width:100%;max-width:640px;height:auto;border:0" /></td></tr>
      <tr><td style="padding:0"><img src="email/p05.jpg" width="640" alt="New: ATLAS Finance. The school's books, by the book: budget, procurement, inventory and property, paying and collecting, books and reports, with separation of duties on every voucher." style="display:block;width:100%;max-width:640px;height:auto;border:0" /></td></tr>
      <tr><td style="padding:0"><img src="email/p06.jpg" width="640" alt="New: the school calendar. Every class, every due date, one calendar: handed-in work checked off, holidays cancel classes, parents see each child, and it can be added to any phone's calendar." style="display:block;width:100%;max-width:640px;height:auto;border:0" /></td></tr>
      <tr><td style="padding:0"><img src="email/p07.jpg" width="640" alt="New for administrators: your school, your rules. A Settings center with all 112 settings in one search, a change history with undo, roles and permissions, and guides that keep up with every release." style="display:block;width:100%;max-width:640px;height:auto;border:0" /></td></tr>
      <tr><td style="padding:0"><img src="email/p08.jpg" width="640" alt="Each person sees their school: students, parents and guardians, faculty, the registrar and deans, HR and payroll, and the finance offices." style="display:block;width:100%;max-width:640px;height:auto;border:0" /></td></tr>
      <tr><td style="padding:0"><img src="email/p09.jpg" width="640" alt="Under the hood: simple to run, built to last. One Node.js program using only Node's standard library, seven web apps with no build step, a JSON data store ready to move to PostgreSQL, optional Keycloak single sign-on, HTTPS through Caddy. No outside packages, over 100 automated tests before every update, nightly backups and daily disk snapshots, on Amazon EC2 or a school computer." style="display:block;width:100%;max-width:640px;height:auto;border:0" /></td></tr>
      <tr><td style="padding:0"><img src="email/p10.jpg" width="640" alt="In every pocket, day and night: every screen works on a phone, in light or dark mode, with no app to install." style="display:block;width:100%;max-width:640px;height:auto;border:0" /></td></tr>
      <tr><td style="padding:0"><img src="email/p11.jpg" width="640" alt="ATLAS keeps growing. Live now: Academic, Learn, People and Finance. Coming soon: the REX Bookstore e-Reader. In development: Facilities, fees and assessment, scheduling, scholarships and guidance." style="display:block;width:100%;max-width:640px;height:auto;border:0" /></td></tr>
