  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#e9e2d6">

      <table role="presentation" width="640" cellpadding="0" cellspacing="0" style="width:100%;max-width:640px;background:#f6efe3">
      <tr><td style="padding:0"><img src="email/g01.jpg" width="640" alt="ATLAS, the prospectus, November 2026. One school. One sign-in. ATLAS is the education platform by Lancaster: classes, student records, people and the school&#x27;s books are four systems that open with the same account. 01 Academic, 02 Learn, 03 People, 04 Finance." style="display:block;width:100%;max-width:640px;height:auto;border:0" /></td></tr>
      <tr><td style="padding:0"><img src="email/g02.jpg" width="640" alt="Four systems, one record of the school. 01 Academic (UIS), the registrar&#x27;s and the dean&#x27;s office: admissions and student records, curricula and evaluation, grade sheets, transcripts with a QR check, CHED and FHE reports. 02 Learn (LMS), the classroom: enrollment and sections, lessons and resources, quizzes and exams, attendance and grades, news, events and the calendar. 03 People (HRIS): employee records, time clock and DTR, leave and approvals, government payroll, payslips and remittances. 04 Finance (FMIS), following COA, DBM and BIR rules: budget and obligations, procurement and property, vouchers and receipts, journals and ledgers, financial statements. Across all four: one sign-in, roles and permissions, many campuses, the school calendar, Help and guides, optional Keycloak single sign-on." style="display:block;width:100%;max-width:640px;height:auto;border:0" /></td></tr>
      <tr><td style="padding:0"><img src="email/g03.jpg" width="640" alt="02 Learn. The week, at a glance: what is due, what is next and how it is going, on one page for every class. Students see their to-do list with due dates, take quizzes and follow their grades. Teachers write lessons, build quizzes and mark attendance. Parents follow each linked child, as far as the school shares." style="display:block;width:100%;max-width:640px;height:auto;border:0" /></td></tr>
      <tr><td style="padding:0"><img src="email/g04.jpg" width="640" alt="From clock-in to the voucher. In People: clock in, attendance, payroll run. In Finance: obligation, voucher, paid and remitted. Pay follows the rules for a state university, and one click sends a finalized run to Finance, all of it or none of it. Demo school payroll, October 16 to 31, 2026, Main Campus, 28 employees: gross pay 558,451.49 pesos, deductions 105,033.37, net pay 453,418.12." style="display:block;width:100%;max-width:640px;height:auto;border:0" /></td></tr>
      <tr><td style="padding:0"><img src="email/g05.jpg" width="640" alt="04 Finance. The school&#x27;s books, by the rules. Budget: appropriations, allotments, NCAs and obligations. Buying and keeping: purchase requests to inspection, property and depreciation. Paying and collecting: vouchers, LDDAP-ADA and checks, official receipts. Books and reports: journals, ledgers and financial statements. Whoever prepares or certifies a voucher cannot approve it." style="display:block;width:100%;max-width:640px;height:auto;border:0" /></td></tr>
      <tr><td style="padding:0"><img src="email/g06.jpg" width="640" alt="A page for everyone at the school. Students: see what is due, take quizzes, follow grades, ask to enroll, request documents. Parents and guardians: follow each linked child. Teachers: lessons, quizzes, attendance, grade sheets, clock in and file leave. Registrars and deans: admit and enroll, keep records, approve grade sheets, issue transcripts. HR and payroll: employee records, attendance, leave, government payroll. Finance offices: budget, procurement, vouchers, receipts and the books. Administrators: one Settings center with history and undo, roles and permissions, campuses and single sign-on." style="display:block;width:100%;max-width:640px;height:auto;border:0" /></td></tr>
      <tr><td style="padding:0"><img src="email/g07.jpg" width="640" alt="Colophon. ATLAS is written in plain JavaScript and runs on Node.js 22, using only its standard library: no framework and no outside packages. Every request passes eight checks: HTTPS only, address check, rate limits, same-site only, session, role and permission, scope, business rules. 0 outside packages, 400 API routes, 129 automated tests run before every update, 1 server for every system and campus." style="display:block;width:100%;max-width:640px;height:auto;border:0" /></td></tr>
      <tr><td style="padding:0"><img src="email/g08.jpg" width="640" alt="In every pocket, day and night. Every screen works on a phone, in light or dark, with no app to install: the calendar with a dot for each class and due date, clocking in from My day, and a guide for your role one tap away." style="display:block;width:100%;max-width:640px;height:auto;border:0" /></td></tr>
      <tr><td style="padding:0"><img src="email/g09.jpg" width="640" alt="Forthcoming. Live now: Academic, Learn, People and Finance. Coming soon: the REX Bookstore e-Reader. In development: Facilities, Fees and assessment, Scheduling, Scholarships and guidance." style="display:block;width:100%;max-width:640px;height:auto;border:0" /></td></tr>
      <tr><td style="padding:0"><img src="email/g10.jpg" width="640" alt="See it for yourself. One account opens every system you may use. Ask for a walkthrough with the demo school, or read the guide for your role under Help. Sign-in address to be announced. ATLAS, education platform by Lancaster, a sibling of CORE." style="display:block;width:100%;max-width:640px;height:auto;border:0" /></td></tr>
