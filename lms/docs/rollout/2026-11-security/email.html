<body style="margin:0;padding:0;background:#efe9e3">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#efe9e3">
    <tr><td align="center" style="padding:24px 12px">
      <table role="presentation" width="640" cellpadding="0" cellspacing="0" style="width:100%;max-width:640px;background:#ffffff">
      <tr><td style="padding:0"><img src="email/s01.jpg" width="640" alt="Security in ATLAS, November 2026. Security, in layers. Every request to ATLAS passes eight checks before it reaches a school&#x27;s records: HTTPS, rate limits, sessions, roles and scope, around your data." style="display:block;width:100%;max-width:640px;height:auto;border:0" /></td></tr>
      <tr><td style="padding:0"><img src="email/s02.jpg" width="640" alt="Eight checks before anything reaches your data. 1, HTTPS only: every connection encrypted, HSTS for a year. 2, Address check: requests must be addressed to the school&#x27;s ATLAS address; malformed ones get a 400. 3, Rate limits per person and per network address; past them, 429. 4, Same-site only: changes only as JSON from ATLAS&#x27;s own pages; the cookie is never sent with another site&#x27;s request. 5, Session: a 256-bit random token in a cookie scripts cannot read; idle sessions end after 8 hours by default. 6, Role and permission: each of 400 API routes states who may call it. 7, Scope: campus, class and family. 8, Business rules: whoever prepares or certifies a voucher cannot approve it; officers cannot change their own pay, leave or attendance. Then your school&#x27;s records, with an audit trail." style="display:block;width:100%;max-width:640px;height:auto;border:0" /></td></tr>
      <tr><td style="padding:0"><img src="email/s03.jpg" width="640" alt="A limit on every door. ATLAS&#x27;s built-in rate limiter counts requests in a sliding window. Past the limit a script gets 429 Too Many Requests with Retry-After. Limits: 300 requests a minute for each signed-in person (60 to 3,000, set by administrators); four times that per network address for visitors not signed in; 60 sign-in attempts a minute per address; 30 wrong passwords in 15 minutes per address; 5 wrong tries lock one username for that address only; 10 applications an hour per address." style="display:block;width:100%;max-width:640px;height:auto;border:0" /></td></tr>
      <tr><td style="padding:0"><img src="email/s04.jpg" width="640" alt="Passwords that are no use to a thief. ATLAS never stores a password: it keeps a salted, slow, one-way scrypt hash, then encrypts it with AES-256-GCM under a key kept outside the data. A copy of the data alone holds no hashes to crack. ATLAS sign-in: HttpOnly, SameSite=Strict, Secure cookies; the same answer in the same time whether or not a username exists; a password change ends every other session. Optional Keycloak single sign-on: OpenID Connect with PKCE, state and nonce; token signature, issuer, audience and expiry checked; accounts link only by a verified email; the school&#x27;s own Keycloak rules apply, including two-step sign-in where it is on." style="display:block;width:100%;max-width:640px;height:auto;border:0" /></td></tr>
      <tr><td style="padding:0"><img src="email/s05.jpg" width="640" alt="The right people, and only them. Roles and permissions, changed only by an administrator. Campus, class and family scope on every record. Separation of duties: whoever prepares or certifies a voucher cannot approve it; no one approves their own requisition or changes their own pay, leave or attendance. Audit trails with the old and new value. Example: a voucher certified by the Chief Accountant cannot be approved by the same person, and is paid to the bank account recorded at certification." style="display:block;width:100%;max-width:640px;height:auto;border:0" /></td></tr>
      <tr><td style="padding:0"><img src="email/s06.jpg" width="640" alt="Safe on the screen, too. Every page carries security headers: Content-Security-Policy, Strict-Transport-Security, nosniff, X-Frame-Options SAMEORIGIN, Referrer-Policy, Permissions-Policy, cross-origin policies, no-store, and HttpOnly SameSite=Strict Secure cookies. Only ATLAS&#x27;s own scripts run; everything typed is escaped; spreadsheet formulas are neutralised in CSV exports; uploads are stored under random names and only PDFs, images, audio and video open in the browser." style="display:block;width:100%;max-width:640px;height:auto;border:0" /></td></tr>
      <tr><td style="padding:0"><img src="email/s07.jpg" width="640" alt="A locked-down server on Amazon Web Services, set up from one CloudFormation template. Network: only ports 80 and 443; no SSH, administrators use AWS Session Manager. Disk: encrypted; the data folder and password key closed to other accounts. Instance: Ubuntu 24.04 LTS with automatic security updates; IMDSv2 required. Service: systemd sandbox, its own account, writes only to its data folder. Updates: every test runs first as an unprivileged account with no network, and the update installs only if all pass. Backups: nightly copy kept 30 days, daily disk snapshot with the last 7 kept." style="display:block;width:100%;max-width:640px;height:auto;border:0" /></td></tr>
      <tr><td style="padding:0"><img src="email/s08.jpg" width="640" alt="Built on the standard library. No web framework and no outside packages. Browser: plain JavaScript ES modules with no build step, HTML and CSS, seven web apps. Edge: Caddy for HTTPS and HSTS; optional Keycloak with OpenID Connect. Server: Node.js 22 LTS using node:http, node:crypto, node:fs and node:test. Data: a JSON data store with atomic saves, a file store, ready for PostgreSQL. Platform: Amazon EC2 by CloudFormation, Ubuntu 24.04 LTS with systemd, encrypted EBS. In numbers: 0 outside packages, about 30,000 lines, 400 API routes, 125 automated tests, 1 server." style="display:block;width:100%;max-width:640px;height:auto;border:0" /></td></tr>
      <tr><td style="padding:0"><img src="email/s09.jpg" width="640" alt="Every fix stays fixed. 125 automated tests, 25 of them security tests. Two in-house security reviews in November 2026, findings fixed and retested. About 9,400 fields tried with a script across about 660 screens, as administrator, registrar, teacher, student and parent. Security is never finished: reviews continue, and every update runs the full test suite before it is installed." style="display:block;width:100%;max-width:640px;height:auto;border:0" /></td></tr>
      <tr><td style="padding:0"><img src="email/s10.jpg" width="640" alt="Secure by design. Simple to run. Ask Lancaster for a walkthrough of ATLAS&#x27;s security set-up with your IT office, or read the Administrator guide under Help. ATLAS, education platform by Lancaster, a sibling of CORE." style="display:block;width:100%;max-width:640px;height:auto;border:0" /></td></tr>
      </table>
