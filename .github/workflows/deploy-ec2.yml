# Tests every push, then installs it on the LTDC ERP server on Amazon EC2
# through AWS Systems Manager (no SSH, no terminal). One-time setup is in
# deploy/aws/EC2.md, "Automatic deployment from GitHub".
# 0.38: the critical user journeys run in a real browser too, and the install waits
# for approval in the "production" environment when it has required reviewers
# (Settings > Environments > production; deploy/aws/EC2.md, "Approve each deploy").
# 0.39 (VAPT round 3, C3-1): only the deploy job, in the production environment, may ask AWS
# for credentials, and the AWS role trusts that environment only; the server accepts a commit to
# install (the ltdc-erp-deploy command), not any command.
name: Deploy to EC2

on:
  push:
    branches: [claude/busy-curie-hfpbg0]
  workflow_dispatch:

# Read-only for every job; only the deploy job adds id-token (below).
permissions:
  contents: read

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm test

  # The journeys people rely on most, in Chromium at desktop and phone width (scripts/journeys.mjs).
  journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # Playwright only for these browser checks; CORE itself has no dependencies.
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: npm run journeys

  # The gate and the install in one job: it runs in the "production" environment, so it waits until
  # a required reviewer approves it there (none set: it goes at once). Its token names that
  # environment, which is the only thing the AWS deploy role trusts; no other job can get one.
  deploy:
    needs: [test, journeys]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 15
    steps:
      # Settings may be saved as repository Variables or as Secrets; either works.
      - name: Check deployment settings
        id: cfg
        env:
          ROLE: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          INSTANCE: ${{ vars.EC2_INSTANCE_ID || secrets.EC2_INSTANCE_ID }}
          REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'ap-southeast-1' }}
        run: |
          trim() { printf '%s' "$1" | tr -d '[:space:]'; }
          ROLE="$(trim "$ROLE")"; INSTANCE="$(trim "$INSTANCE")"; REGION="$(trim "$REGION")"
          missing=""
          [ -n "$ROLE" ] || missing="$missing AWS_ROLE_ARN"
          [ -n "$INSTANCE" ] || missing="$missing EC2_INSTANCE_ID"
          if [ -n "$missing" ]; then
            msg="Not deployed: GitHub cannot see${missing}. Add each in this repository under Settings > Secrets and variables > Actions (Variables tab, or Secrets tab), with exactly that name. Values saved under an Environment are not used."
            echo "::warning::$msg"
            echo "### Tests passed, but nothing was deployed" >> "$GITHUB_STEP_SUMMARY"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$ROLE" =~ ^arn:aws:iam::[0-9]{12}:role/.+ ]]; then
            echo "::error::AWS_ROLE_ARN should look like arn:aws:iam::123456789012:role/ltdc-erp-github-deploy (copy AwsRoleArn from the CloudFormation Outputs tab)."; exit 1
          fi
          if ! [[ "$INSTANCE" =~ ^i-[0-9a-f]{8,17}$ ]]; then
            echo "::error::EC2_INSTANCE_ID should look like i-0123456789abcdef0 (copy Ec2InstanceId from the CloudFormation Outputs tab)."; exit 1
          fi
          if ! [[ "$REGION" =~ ^[a-z]{2}(-[a-z]+)+-[0-9]$ ]]; then
            echo "::error::AWS_REGION should look like ap-southeast-1."; exit 1
          fi
          { echo "DEPLOY_ROLE=$ROLE"; echo "DEPLOY_INSTANCE=$INSTANCE"; echo "DEPLOY_REGION=$REGION"; } >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "Deploying to $INSTANCE in $REGION."

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        id: aws
        if: steps.cfg.outputs.configured == 'true'
        continue-on-error: true
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.DEPLOY_REGION }}

      # A stack that trusts the deploy branch (the 0.33 template) does not trust this job, which runs
      # in the "production" environment since 0.39: say what to do instead of a bare AWS error.
      - name: Explain a refused AWS sign-in
        if: steps.cfg.outputs.configured == 'true' && steps.aws.outcome == 'failure'
        run: |
          msg="AWS refused the deploy role. Since 0.39 only the deploy job in the GitHub environment \"production\" may use it: update the CloudFormation stack with deploy/aws/github-deploy.yaml (deploy/aws/EC2.md, \"Update the stack\"), then click Re-run all jobs. The server keeps running the previous version."
          echo "::error::$msg"
          { echo "### Not deployed: AWS refused the deploy role"; echo "$msg"; } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Install the new version on the server
        if: steps.cfg.outputs.configured == 'true'
        env:
          INSTANCE_ID: ${{ env.DEPLOY_INSTANCE }}
          # Read-only for this repository; it expires when this job ends.
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # 0.39: the server's own command (ltdc-erp-deploy, made by the CloudFormation stack) takes only
          # the commit and the download token, each checked against a pattern. A stack from before 0.39
          # does not have it: then the old way (AWS-RunShellScript) is used until the stack is updated.
          PARAMS="$(jq -n --arg sha "$SHA" --arg t "$TOKEN" '{Sha: [$sha], Token: [$t]}')"
          if CMD_ID="$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name ltdc-erp-deploy \
              --comment "LTDC ERP deploy ${SHA:0:7}" --parameters "$PARAMS" --query Command.CommandId --output text 2>send.err)"; then
            echo "Sent with the ltdc-erp-deploy command."
          # A stack without the command: AWS says InvalidDocument, or AccessDenied on the document when
          # the role's policy predates it (the original stack). The old command then runs only if the
          # stack still allows it; an updated stack refuses it.
          elif grep -q 'InvalidDocument' send.err || grep -q 'AccessDenied.*document/ltdc-erp-deploy' send.err; then
            echo "::warning::The CloudFormation stack is older than 0.39 (no ltdc-erp-deploy command). Update it: deploy/aws/EC2.md, \"Update the stack\"."
            read -r -d '' SCRIPT <<'SH' || true
          set -eu
          DIR="$(mktemp -d)"
          trap 'rm -rf "$DIR"' EXIT
          umask 077
          printf 'Authorization: Bearer %s\n' '__TOKEN__' > "$DIR/auth"
          curl -fsSL -H @"$DIR/auth" -H "Accept: application/vnd.github+json" -o "$DIR/src.tar.gz" "https://api.github.com/repos/__REPO__/tarball/__SHA__"
          mkdir "$DIR/ltdc-erp"
          tar xzf "$DIR/src.tar.gz" -C "$DIR/ltdc-erp" --strip-components=1
          bash "$DIR/ltdc-erp/deploy/aws/remote-deploy.sh" "$DIR/ltdc-erp" "__SHA__"
          SH
            SCRIPT="${SCRIPT//__TOKEN__/$TOKEN}"
            SCRIPT="${SCRIPT//__REPO__/$REPO}"
            SCRIPT="${SCRIPT//__SHA__/$SHA}"
            OLD="$(jq -n --arg s "$SCRIPT" '{commands: [$s], executionTimeout: ["600"]}')"
            CMD_ID="$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
              --comment "LTDC ERP deploy ${SHA:0:7}" --parameters "$OLD" --query Command.CommandId --output text)"
          else
            cat send.err >&2
            exit 1
          fi
          rm -f send.err
          echo "Sent to $INSTANCE_ID (command $CMD_ID). Waiting for the server…"

          STATUS=Pending
          for _ in $(seq 1 120); do
            sleep 5
            STATUS="$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)"
            case "$STATUS" in Pending|InProgress|Delayed) ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text || true
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text >&2 || true
          if [ "$STATUS" != Success ]; then
            echo "::error::Deployment did not finish (status: $STATUS). The server keeps running the previous version unless the log above says otherwise."
            exit 1
          fi
          echo "### Deployed ${SHA:0:7} to the LTDC ERP server" >> "$GITHUB_STEP_SUMMARY"
