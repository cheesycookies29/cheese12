# Tests every push, then installs it on the LTDC ERP server on Amazon EC2
# through AWS Systems Manager (no SSH, no terminal). One-time setup is in
# deploy/aws/EC2.md, "Automatic deployment from GitHub".
name: Deploy to EC2

on:
  push:
    branches: [claude/busy-curie-hfpbg0]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Settings may be saved as repository Variables or as Secrets; either works.
      - name: Check deployment settings
        id: cfg
        env:
          ROLE: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          INSTANCE: ${{ vars.EC2_INSTANCE_ID || secrets.EC2_INSTANCE_ID }}
          REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'ap-southeast-1' }}
        run: |
          trim() { printf '%s' "$1" | tr -d '[:space:]'; }
          ROLE="$(trim "$ROLE")"; INSTANCE="$(trim "$INSTANCE")"; REGION="$(trim "$REGION")"
          missing=""
          [ -n "$ROLE" ] || missing="$missing AWS_ROLE_ARN"
          [ -n "$INSTANCE" ] || missing="$missing EC2_INSTANCE_ID"
          if [ -n "$missing" ]; then
            msg="Not deployed: GitHub cannot see${missing}. Add each in this repository under Settings > Secrets and variables > Actions (Variables tab, or Secrets tab), with exactly that name. Values saved under an Environment are not used."
            echo "::warning::$msg"
            echo "### Tests passed, but nothing was deployed" >> "$GITHUB_STEP_SUMMARY"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$ROLE" =~ ^arn:aws:iam::[0-9]{12}:role/.+ ]]; then
            echo "::error::AWS_ROLE_ARN should look like arn:aws:iam::123456789012:role/ltdc-erp-github-deploy (copy AwsRoleArn from the CloudFormation Outputs tab)."; exit 1
          fi
          if ! [[ "$INSTANCE" =~ ^i-[0-9a-f]{8,17}$ ]]; then
            echo "::error::EC2_INSTANCE_ID should look like i-0123456789abcdef0 (copy Ec2InstanceId from the CloudFormation Outputs tab)."; exit 1
          fi
          if ! [[ "$REGION" =~ ^[a-z]{2}(-[a-z]+)+-[0-9]$ ]]; then
            echo "::error::AWS_REGION should look like ap-southeast-1."; exit 1
          fi
          { echo "DEPLOY_ROLE=$ROLE"; echo "DEPLOY_INSTANCE=$INSTANCE"; echo "DEPLOY_REGION=$REGION"; } >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "Deploying to $INSTANCE in $REGION."

      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.cfg.outputs.configured == 'true'
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.DEPLOY_REGION }}

      - name: Install the new version on the server
        if: steps.cfg.outputs.configured == 'true'
        env:
          INSTANCE_ID: ${{ env.DEPLOY_INSTANCE }}
          # Read-only token for this repository; it expires when this job ends.
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # Runs on the server as root (POSIX sh): download this exact commit and install it.
          read -r -d '' SCRIPT <<'SH' || true
          set -eu
          DIR="$(mktemp -d)"
          trap 'rm -rf "$DIR"' EXIT
          curl -fsSL -H "Authorization: Bearer __TOKEN__" -H "Accept: application/vnd.github+json" -o "$DIR/src.tar.gz" "https://api.github.com/repos/__REPO__/tarball/__SHA__"
          mkdir "$DIR/ltdc-erp"
          tar xzf "$DIR/src.tar.gz" -C "$DIR/ltdc-erp" --strip-components=1
          bash "$DIR/ltdc-erp/deploy/aws/remote-deploy.sh" "$DIR/ltdc-erp" "__SHA__"
          SH
          SCRIPT="${SCRIPT//__TOKEN__/$TOKEN}"
          SCRIPT="${SCRIPT//__REPO__/$REPO}"
          SCRIPT="${SCRIPT//__SHA__/$SHA}"
          PARAMS="$(jq -n --arg s "$SCRIPT" '{commands: [$s], executionTimeout: ["600"]}')"

          CMD_ID="$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
            --comment "LTDC ERP deploy ${SHA:0:7}" --parameters "$PARAMS" --query Command.CommandId --output text)"
          echo "Sent to $INSTANCE_ID (command $CMD_ID). Waiting for the server…"

          STATUS=Pending
          for _ in $(seq 1 120); do
            sleep 5
            STATUS="$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)"
            case "$STATUS" in Pending|InProgress|Delayed) ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text || true
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text >&2 || true
          if [ "$STATUS" != Success ]; then
            echo "::error::Deployment did not finish (status: $STATUS). The server keeps running the previous version unless the log above says otherwise."
            exit 1
          fi
          echo "### Deployed ${SHA:0:7} to the LTDC ERP server" >> "$GITHUB_STEP_SUMMARY"
