# Added to the ltdc-erp service by remote-deploy.sh (VAPT round 3, 0.39), as
# /etc/systemd/system/ltdc-erp.service.d/hardening.conf:
# - the app never needs the instance metadata service (only the backup jobs do), so it cannot reach
#   it: a flaw in the app could not take the server's AWS credentials (C3-12);
# - CORE runs behind the local HTTPS proxy, so it reads the visitor's address from X-Forwarded-For
#   (A3-1: elsewhere it does not).
[Service]
IPAddressDeny=169.254.169.254
Environment=TRUST_PROXY=1
