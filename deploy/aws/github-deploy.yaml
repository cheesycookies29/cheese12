AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  LTDC ERP automatic deployment. Lets the "Deploy to EC2" GitHub workflow send the
  install command to one EC2 instance through AWS Systems Manager, and gives the
  instance the role Systems Manager needs. No SSH or stored AWS keys.

Parameters:
  InstanceId:
    Type: AWS::EC2::Instance::Id
    Description: The LTDC ERP server (EC2 > Instances > ltdc-erp > Instance ID).
  GitHubRepository:
    Type: String
    Default: cheesycookies29/cheese12
    Description: owner/name of the GitHub repository allowed to deploy.
  CreateGitHubConnection:
    Type: String
    Default: 'Yes'
    AllowedValues: ['Yes', 'No']
    Description: >-
      Choose No only if this AWS account already has an identity provider for
      token.actions.githubusercontent.com (IAM > Identity providers).

Conditions:
  CreateProvider: !Equals [!Ref CreateGitHubConnection, 'Yes']

Resources:
  GitHubProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1, 1c58a3a8518e8759bf075b76b750d4f2df264fcd]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ltdc-erp-github-deploy
      Description: Assumed by the LTDC ERP GitHub workflow to deploy to the server.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateProvider
                - !Ref GitHubProvider
                - !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepository}:*
      Policies:
        - PolicyName: send-deploy-command
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${InstanceId}
                  - !Sub arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript
              - Effect: Allow
                Action: [ssm:GetCommandInvocation, ssm:ListCommandInvocations]
                Resource: '*'

  ServerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ltdc-erp-server
      Description: Lets AWS Systems Manager run the deploy command on the LTDC ERP server.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore

  ServerInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: ltdc-erp-server
      Roles: [!Ref ServerRole]

Outputs:
  AwsRoleArn:
    Description: GitHub repository variable AWS_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
  Ec2InstanceId:
    Description: GitHub repository variable EC2_INSTANCE_ID
    Value: !Ref InstanceId
  AwsRegion:
    Description: GitHub repository variable AWS_REGION
    Value: !Ref AWS::Region
  ServerIamRole:
    Description: Attach to the instance (EC2 > Actions > Security > Modify IAM role)
    Value: !Ref ServerInstanceProfile
