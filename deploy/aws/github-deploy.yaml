AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  LTDC ERP automatic deployment and off-server backups. Lets the "Deploy to EC2" GitHub
  workflow send the install command to one EC2 instance through AWS Systems Manager,
  gives the instance the role Systems Manager needs, and a private S3 bucket for its
  hourly backups. No SSH or stored AWS keys.

Parameters:
  InstanceId:
    Type: AWS::EC2::Instance::Id
    Description: The LTDC ERP server (EC2 > Instances > ltdc-erp > Instance ID).
  GitHubRepository:
    Type: String
    Default: cheesycookies29/cheese12
    Description: owner/name of the GitHub repository allowed to deploy.
  DeployEnvironment:
    Type: String
    Default: production
    Description: >-
      The GitHub environment whose jobs may deploy (VAPT 0.39): only the deploy job runs in it. On
      GitHub, limit the environment to the deploy branch and give it required reviewers
      (deploy/aws/EC2.md, "D. Approve each deploy"); other jobs, branches, tags and pull requests
      cannot use the deploy role.
  CreateGitHubConnection:
    Type: String
    Default: 'Yes'
    AllowedValues: ['Yes', 'No']
    Description: >-
      Choose No only if this AWS account already has an identity provider for
      token.actions.githubusercontent.com (IAM > Identity providers).

Conditions:
  CreateProvider: !Equals [!Ref CreateGitHubConnection, 'Yes']

Resources:
  GitHubProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1, 1c58a3a8518e8759bf075b76b750d4f2df264fcd]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ltdc-erp-github-deploy
      Description: Assumed by the LTDC ERP GitHub workflow to deploy to the server.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateProvider
                - !Ref GitHubProvider
                - !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Only the deploy job, in the protected environment (VAPT 0.39, C3-1): not the test or
                # browser jobs, not other branches, tags or pull requests.
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepository}:environment:${DeployEnvironment}
      Policies:
        - PolicyName: send-deploy-command
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Only the deploy command, which takes a commit and nothing else (VAPT 0.39): not any
              # shell command as root.
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${InstanceId}
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:document/${DeployDocument}
              - Effect: Allow
                Action: [ssm:GetCommandInvocation, ssm:ListCommandInvocations]
                Resource: '*'

  # The deploy command: download one commit of the repository with a read-only token and install
  # it. Both inputs must match their patterns, so nothing else can be run through it.
  DeployDocument:
    Type: AWS::SSM::Document
    Properties:
      Name: ltdc-erp-deploy
      DocumentType: Command
      UpdateMethod: NewVersion
      Content:
        schemaVersion: '2.2'
        description: Install one commit of LTDC ERP from GitHub.
        parameters:
          Sha:
            type: String
            description: The commit to install.
            allowedPattern: '^[0-9a-f]{40}$'
          Token:
            type: String
            description: The workflow's read-only GitHub token (expires when the job ends).
            allowedPattern: '^[A-Za-z0-9_]{20,255}$'
        mainSteps:
          - action: aws:runShellScript
            name: install
            inputs:
              timeoutSeconds: '600'
              runCommand:
                - !Sub |
                  set -eu
                  DIR="$(mktemp -d)"
                  trap 'rm -rf "$DIR"' EXIT
                  umask 077
                  printf 'Authorization: Bearer %s\n' '{{ Token }}' > "$DIR/auth"
                  curl -fsSL -H @"$DIR/auth" -H "Accept: application/vnd.github+json" -o "$DIR/src.tar.gz" "https://api.github.com/repos/${GitHubRepository}/tarball/{{ Sha }}"
                  mkdir "$DIR/ltdc-erp"
                  tar xzf "$DIR/src.tar.gz" -C "$DIR/ltdc-erp" --strip-components=1
                  bash "$DIR/ltdc-erp/deploy/aws/remote-deploy.sh" "$DIR/ltdc-erp" '{{ Sha }}'

  # Off-server backups (0.38): the server copies its data here every hour (scripts/offsite-backup.js).
  # Private, encrypted, HTTPS only; hourly copies are kept 30 days, attached files until deleted.
  BackupBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub ltdc-erp-backups-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      # Versions kept: a copy overwritten (by mistake, or by someone who took over the server) can
      # still be restored for 30 days.
      VersioningConfiguration: { Status: Enabled }
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - Id: hourly-copies-30-days
            Status: Enabled
            Prefix: hourly/
            ExpirationInDays: 30
          - Id: old-versions-30-days
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 30 }
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }

  BackupBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BackupBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: HttpsOnly
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt BackupBucket.Arn, !Sub '${BackupBucket.Arn}/*']
            Condition: { Bool: { aws:SecureTransport: 'false' } }
          # No upload may replace an object (VAPT 0.39, C3-2): every PUT must say If-None-Match: *.
          # With versioning, a server that is taken over cannot rewrite the history it copied.
          - Sid: NoOverwrites
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub '${BackupBucket.Arn}/*'
            Condition: { 'Null': { 's3:if-none-match': 'true' } }

  ServerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ltdc-erp-server
      Description: Lets AWS Systems Manager run the deploy command on the LTDC ERP server, and the server copy its backups to S3.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      # Write and read its own backups; it cannot list or delete them, and an overwrite keeps the old
      # version, so a compromised server cannot wipe the history (old copies expire by the bucket's rules).
      Policies:
        - PolicyName: backups
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub '${BackupBucket.Arn}/*'

  ServerInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: ltdc-erp-server
      Roles: [!Ref ServerRole]

Outputs:
  AwsRoleArn:
    Description: GitHub repository variable AWS_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
  Ec2InstanceId:
    Description: GitHub repository variable EC2_INSTANCE_ID
    Value: !Ref InstanceId
  AwsRegion:
    Description: GitHub repository variable AWS_REGION
    Value: !Ref AWS::Region
  ServerIamRole:
    Description: Attach to the instance (EC2 > Actions > Security > Modify IAM role)
    Value: !Ref ServerInstanceProfile
  BackupBucketName:
    Description: Where the server copies its data every hour (Admin panel > Security monitor shows the last copy)
    Value: !Ref BackupBucket
